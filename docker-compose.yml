version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: certificate_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: certificate_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d certificate_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: certificate_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Bulk Certificate Generator API
      - APP_ENV=production
      - DEBUG=False
      - API_V1_STR=/api/v1
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/certificate_db
      - STORAGE_DIR=storage/certificates
    volumes:
      - ./storage/certificates:/app/storage/certificates
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
